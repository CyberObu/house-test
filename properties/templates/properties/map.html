{% extends 'base.html' %}

{% block title %}Property Map - NyumbaHub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  #property-map { height: 75vh; border-radius: 1rem; }
  .leaflet-popup-content-wrapper { border-radius: 1rem; padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0; min-width: 220px; }
  .map-popup-img { width: 100%; height: 130px; object-fit: cover; }
  .map-popup-body { padding: 12px; }
  .map-popup-price { color: #F59E0B; font-weight: 700; font-size: 1rem; }
  .map-popup-title { color: #1D3557; font-weight: 600; font-size: 0.9rem; margin: 4px 0; }
  .map-popup-meta { color: #6b7280; font-size: 0.78rem; }
  .map-popup-btn { display:block; background:#1D3557; color:#fff; text-align:center; padding:7px; border-radius:0 0 1rem 1rem; font-size:0.82rem; font-weight:600; text-decoration:none; }
  .map-popup-btn:hover { background:#F59E0B; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">

  <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
    <div>
      <h1 class="text-3xl font-bold text-primary">Property Map</h1>
      <p class="text-gray-500 mt-1"><span id="visible-count">{{ total }}</span> properties shown on map</p>
    </div>
    <a href="{% url 'properties:list' %}" class="btn-outline text-sm">
      <i class="fas fa-list mr-2"></i>List View
    </a>
  </div>

  <!-- Filters -->
  <form method="get" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 mb-6">
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 items-end">
      <div>
        <label class="text-xs font-semibold text-gray-500 uppercase mb-1 block">Status</label>
        <select name="status" class="filter-input text-sm">
          <option value="">All</option>
          <option value="for_sale" {% if filter.data.status == 'for_sale' %}selected{% endif %}>For Sale</option>
          <option value="for_rent" {% if filter.data.status == 'for_rent' %}selected{% endif %}>For Rent</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 uppercase mb-1 block">Type</label>
        <select name="property_type" class="filter-input text-sm">
          <option value="">All Types</option>
          {% for pt in filter.filters.property_type.queryset %}
          <option value="{{ pt.pk }}" {% if filter.data.property_type == pt.pk|stringformat:"s" %}selected{% endif %}>{{ pt.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 uppercase mb-1 block">Min Price</label>
        <input type="number" name="min_price" value="{{ filter.data.min_price|default:'' }}" class="filter-input text-sm" placeholder="TZS">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 uppercase mb-1 block">Max Price</label>
        <input type="number" name="max_price" value="{{ filter.data.max_price|default:'' }}" class="filter-input text-sm" placeholder="TZS">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 uppercase mb-1 block">Bedrooms</label>
        <input type="number" name="bedrooms" value="{{ filter.data.bedrooms|default:'' }}" class="filter-input text-sm" min="0">
      </div>
      <div class="flex items-end">
        <button type="submit" class="btn-primary w-full text-sm">
          <i class="fas fa-search mr-1"></i>Search
        </button>
      </div>
    </div>
  </form>

  <div id="property-map" class="shadow-lg"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const props = {{ props_json|safe }};

const map = L.map('property-map').setView([-6.3690, 34.8888], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

const icon = L.divIcon({
  className: '',
  html: '<div style="background:#1D3557;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.3)">TZS</div>',
  iconAnchor: [20, 16],
});

const bounds = [];
props.forEach(p => {
  const marker = L.marker([p.lat, p.lng], { icon }).addTo(map);
  const img = p.image ? `<img src="${p.image}" class="map-popup-img" alt="${p.title}">` : `<div class="map-popup-img" style="background:#e8ecf2;display:flex;align-items:center;justify-content:center"><span style="color:#1D3557;font-size:2rem">🏠</span></div>`;
  marker.bindPopup(`
    ${img}
    <div class="map-popup-body">
      <div class="map-popup-price">TZS ${Number(p.price).toLocaleString()}</div>
      <div class="map-popup-title">${p.title}</div>
      <div class="map-popup-meta">📍 ${p.city} &nbsp;|&nbsp; 🛏 ${p.bedrooms} &nbsp;|&nbsp; 🚿 ${p.bathrooms}</div>
    </div>
    <a href="${p.url}" class="map-popup-btn">View Details →</a>
  `, { maxWidth: 260 });
  bounds.push([p.lat, p.lng]);
});

if (bounds.length > 0) {
  map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
}
document.getElementById('visible-count').textContent = props.length;
</script>
{% endblock %}
